<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explore Old Town Alexandria, Virginia with our curated interactive map directory. Find the best restaurants, historic spots, hidden speakeasies, and unique local experiences.">
  <title>Old Town Explorer | Curated Alexandria Guide & Map</title>

  <!-- Leaflet.js CSS from CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />

  <!-- Custom Application Stylesheet -->
  <link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

  <!-- App Wrapper Container -->
  <div class="app-container">

    <!-- Mobile Floating Toggle Button -->
    <div class="mobile-controls">
      <button id="menu-toggle" class="menu-toggle-btn" aria-label="Open location directory" aria-expanded="false" aria-controls="explorer-sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Mobile Drawer Overlay Backdrop -->
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <!-- Sidebar Navigation & Directory -->
    <aside id="explorer-sidebar" class="sidebar">
      <!-- Header -->
      <header class="sidebar-header">
        <h1>Old Town Explorer</h1>
        <p>A curated guide to local restaurants, bars, and unique experiences in Alexandria, Virginia.</p>
      </header>

      <!-- Filtering Section -->
      <section class="filter-section" aria-label="Directory Filters">
        <h2 class="filter-title">Filter Experiences</h2>
        <div class="filter-buttons">
          <button id="filter-btn-all" class="filter-btn active" data-filter="all" aria-pressed="true">
            <span class="badge-dot all"></span>
            All Experiences
          </button>
          <button id="filter-btn-food" class="filter-btn" data-filter="food" aria-pressed="false">
            <span class="badge-dot food"></span>
            Food & Dining
          </button>
          <button id="filter-btn-bar" class="filter-btn" data-filter="bar" aria-pressed="false">
            <span class="badge-dot bar"></span>
            Bars & Speakeasies
          </button>
          <button id="filter-btn-experience" class="filter-btn" data-filter="experience" aria-pressed="false">
            <span class="badge-dot experience"></span>
            Historic & Unique
          </button>
        </div>
      </section>

      <!-- Directory List Section -->
      <section class="directory-section" aria-label="Directory Directory List">
        <ul id="directory-list" class="directory-list">
          <!-- Dynamic items injected here via app.js -->
        </ul>
      </section>

      <!-- Sidebar Footer / Admin Portal Link -->
      <footer class="sidebar-footer">
        <a id="admin-portal-link" href="admin.html" class="admin-link">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          Admin Portal
        </a>
      </footer>
    </aside>

    <!-- Full-Bleed Map Viewport -->
    <main class="map-area" aria-label="Interactive Map Viewport">
      <div id="map"></div>
    </main>

  </div>

  <!-- Leaflet.js from CDN -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- Location Data Script (Defines OLD_TOWN_LOCATIONS) -->
  <script src="data.js?v=5"></script>

  <!-- Main Application Script -->
  <script src="app.js?v=5"></script>

</body>
</html>
