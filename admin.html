<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Secure admin portal for managing Old Town Explorer locations.">
  <meta name="theme-color" content="#0f172a">
  <title>Admin Portal | Old Town Explorer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body class="admin-page">

  <header class="admin-header">
    <h1>Old Town Explorer Admin Portal</h1>
    <div class="admin-header-actions">
      <span id="auth-user" class="auth-user" hidden></span>
      <button id="btn-logout" class="btn-secondary" type="button" hidden>Sign out</button>
      <a href="index.html" class="btn-secondary" id="back-to-explorer">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Explorer
      </a>
    </div>
  </header>

  <main id="auth-gate" class="auth-gate">
    <section class="auth-card" aria-labelledby="login-title">
      <p class="auth-eyebrow">Authorized access only</p>
      <h2 id="login-title">Sign in to manage places</h2>
      <p class="auth-intro">Use an editor or administrator account created in PocketBase.</p>

      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btn-login" class="btn-submit">Sign in</button>
        <p id="login-status" class="form-status" role="alert" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <div id="admin-container" class="admin-container" hidden>
    <aside class="admin-sidebar">
      <section class="form-section" aria-label="Location form">
        <div class="admin-form-card">
          <h2 class="form-title" id="form-title">Add New Location</h2>

          <form id="add-location-form">
            <div class="form-group">
              <label for="loc-name">Location Name</label>
              <input type="text" id="loc-name" class="form-input" placeholder="e.g. Gadsby's Tavern" maxlength="120" required>
            </div>

            <div class="form-group">
              <label for="loc-type">Category</label>
              <select id="loc-type" class="form-select" required>
                <option value="" disabled selected>Select category...</option>
                <option value="food">Food & Dining</option>
                <option value="bar">Bars & Speakeasies</option>
                <option value="experience">Historic & Unique</option>
              </select>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="loc-lat">Latitude</label>
                <input type="number" id="loc-lat" class="form-input" step="any" min="-90" max="90" placeholder="38.8045" required>
              </div>
              <div class="form-group">
                <label for="loc-lng">Longitude</label>
                <input type="number" id="loc-lng" class="form-input" step="any" min="-180" max="180" placeholder="-77.0425" required>
              </div>
            </div>

            <div class="form-group">
              <label for="loc-desc">Description</label>
              <textarea id="loc-desc" class="form-textarea" maxlength="600" placeholder="Describe the atmosphere, history, or unique offerings..." required></textarea>
            </div>

            <label class="checkbox-row" for="loc-published">
              <input type="checkbox" id="loc-published" checked>
              <span>
                <strong>Published</strong>
                <small>Show this place on the public explorer.</small>
              </span>
            </label>

            <div class="form-actions">
              <button type="submit" id="btn-submit" class="btn-submit">Save Location</button>
              <button type="button" id="btn-cancel-edit" class="btn-cancel" hidden>Cancel</button>
            </div>
            <p id="admin-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section class="listings-section" aria-label="Locations directory table">
        <div class="listings-heading">
          <h2 class="listings-title">Locations</h2>
          <span id="role-note" class="role-note"></span>
        </div>
        <div class="listings-table-container">
          <table class="listings-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Status</th>
                <th class="actions-column">Action</th>
              </tr>
            </thead>
            <tbody id="listings-tbody"></tbody>
          </table>
        </div>
      </section>
    </aside>

    <main class="admin-map-area" aria-label="Coordinate picker map">
      <div class="map-helper-badge">
        <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
          <circle cx="12" cy="10" r="3"></circle>
        </svg>
        Click anywhere on the map to set coordinates
      </div>
      <div id="admin-map" class="admin-map-container"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="vendor/pocketbase.umd.js"></script>
  <script src="config.js?v=1"></script>
  <script src="data.js?v=6"></script>
  <script src="admin.js?v=6"></script>
</body>
</html>
